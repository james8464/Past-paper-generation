[project]
name = "keldin-edexcel"
version = "0.2.0"
description = "Unofficial Pearson Edexcel A-Level Economics A practice paper generator."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "pydantic>=2.0",
  "pymupdf>=1.24,<2",
  "reportlab>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
keldin-edexcel = "keldin_edexcel.cli:main"

[tool.setuptools.packages.find]
include = ["keldin_edexcel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
