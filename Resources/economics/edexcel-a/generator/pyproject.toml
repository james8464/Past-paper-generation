[project]
name = "pastpapergen"
version = "0.1.0"
description = "Unofficial Pearson Edexcel A-Level Economics A practice paper generator."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "pydantic>=2.0",
  "pymupdf>=1.24",
  "reportlab>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
pastpapergen = "pastpapergen.cli:main"

[tool.setuptools.packages.find]
include = ["pastpapergen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
