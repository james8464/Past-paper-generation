[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "examforge-ocr-computer-science"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "reportlab>=4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrcsgen*"]
