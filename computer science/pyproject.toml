[project]
name = "cspapergen"
version = "0.1.0"
description = "Unofficial AQA A-Level Computer Science Paper 2 practice paper generator."
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "pydantic>=2.0",
  "reportlab>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
cspapergen = "cspapergen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
