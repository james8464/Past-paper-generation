# Check shared client and adapter contracts plus two infrastructure leaves.
# Legacy generator implementations remain outside this scoped gate.
[mypy]
python_version = 3.12
strict = True
show_error_codes = True
warn_unused_configs = True
follow_imports = normal
files = Backend/Core/json_client.py, Backend/Core/family_contracts.py, tools/pdf_process.py, tools/atomic_json.py

# Retain the concrete runtime checkpoint annotation without recursively checking
# its Pydantic assessment models here. Four family type parameters are checked;
# this gate makes no checkpoint implementation/static-safety claim.
[mypy-Backend.Core.assessment_checkpoints]
follow_imports = skip
